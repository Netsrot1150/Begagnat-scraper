[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "begagnat-scraper"
version = "0.1.0"
description = "Search Swedish and international second-hand marketplaces for high-VRAM GPUs suitable for local AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
browser = ["playwright>=1.44"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
begagnat = "begagnat.cli:main"

[tool.setuptools.packages.find]
include = ["begagnat*"]

[tool.setuptools.package-data]
begagnat = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
