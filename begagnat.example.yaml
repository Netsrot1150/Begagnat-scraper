# Copy to begagnat.yaml (or ~/.config/begagnat/config.yaml) and edit.
# Everything under `defaults` is merged into every profile; a profile's own
# keys win.

defaults:
  sources: [blocket, tradera, ebay]
  min_vram: 16              # GB, total across the cards in the listing
  min_tier: ok              # skip architectures that are painful for inference
  limit: 60                 # listings fetched per source per pass

fx:
  # Static rates to SEK. Update these now and then, or pass --fx USD=11.1.
  USD: 9.70
  EUR: 11.30

# Credentials belong here rather than on a command line, where they would land
# in the shell history and in `ps`. Both official APIs are picked up
# automatically as soon as their pair is present.
source_options:
  ebay:
    domain: ebay.de         # EU seller -> no import VAT on top
    # client_id: ...        # from https://developer.ebay.com/ (production keys)
    # client_secret: ...
  tradera:
    # app_id: ...           # from https://api.tradera.com/register
    # app_key: ...
    sort: Relevance         # or EndDate/Price/Bids {Ascending,Descending}
  marketplace:
    city: stockholm
    radius_km: 100

# AI validation. Only runs when you pass --ai; needs ANTHROPIC_API_KEY.
ai:
  model: claude-opus-5     # claude-sonnet-5 / claude-haiku-4-5 are cheaper for volume
  batch_size: 8            # listings per API call
  effort: low              # low is plenty for screening ads

notify:
  console: true
  # Push to your phone via ntfy.sh - install the app and subscribe to the topic.
  # ntfy:
  #   topic: gpu-fynd-8f3a2
  # Discord or Slack incoming webhook:
  # webhook: https://discord.com/api/webhooks/...
  # jsonl: hits.jsonl

profiles:
  # The one you asked for: any P100 under 1400 kr.
  - name: p100-fynd
    query: tesla p100
    max_price: 1400
    per_model_max_price:
      Tesla P100: 1400      # per card, so a 2-pack may cost up to 2800 kr

  # Cheap bulk VRAM: 24 GB Pascal cards.
  - name: p40-24gb
    query: tesla p40
    max_price: 2500
    min_vram: 24

  # The best all-round card if one shows up cheap.
  - name: 3090-billig
    query: rtx 3090
    max_price: 5500
    min_tier: great

  # Anything with a lot of VRAM at a low price per GB, whatever the model.
  - name: kr-per-gb-jakt
    query: grafikkort
    min_vram: 16
    max_kr_per_gb: 120
    exclude: [laptop, bärbar, gaming pc, stationär]
